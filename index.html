<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17141f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Блокнот</title>
<style>
:root{
  --bg:#fff8f1; --card:#ffffff; --text:#2b2233; --muted:#8c8496;
  --accent:#f0582b; --accent-soft:#ffeadf; --chip:#f6eee8; --chip-on:#f0582b;
  --border:#f1e6dc; --shadow:0 2px 10px rgba(120,60,20,.08);
  --danger:#e03131;
  --glow1:#ffe0cc; --glow2:#fff1b8; --glow3:#e3f0ff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17141f; --card:#231f2e; --text:#f1ecf7; --muted:#a49cb2;
    --accent:#ff8a5c; --accent-soft:#3b2530; --chip:#2e293b; --chip-on:#ff8a5c;
    --border:#332d42; --shadow:0 2px 10px rgba(0,0,0,.35);
    --glow1:#3a2135; --glow2:#2a2440; --glow3:#1c2a40;
  }
}
/* внутри списка всё окрашивается в его цвет (--lc — яркий, --lcd — глубокий для кнопок и текста) */
:root[data-lc]{--accent:var(--lcd); --chip-on:var(--lcd); --accent-soft:color-mix(in srgb,var(--lc) 18%,var(--card))}
@media (prefers-color-scheme: dark){:root[data-lc]{--accent:var(--lc); --chip-on:var(--lcd); --accent-soft:color-mix(in srgb,var(--lc) 22%,var(--card))}}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:radial-gradient(900px 520px at 105% -8%,var(--glow1),transparent 62%),
    radial-gradient(700px 480px at -15% 18%,var(--glow2),transparent 60%),
    radial-gradient(800px 600px at 50% 110%,var(--glow3),transparent 60%) var(--bg);
  background-attachment:fixed; min-height:100vh;
  color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif; font-size:15px;
  touch-action:manipulation;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:520px; margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 90px calc(14px + env(safe-area-inset-left))}
button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer}
/* 16px обязателен: iOS Safari зумит поля мельче 16px при фокусе и не отъезжает обратно */
input,textarea,select{font:inherit; font-size:16px; color:var(--text)}

.top{display:flex; align-items:center; gap:8px; padding:6px 0 14px}
.top h1{font-size:23px; font-weight:800; letter-spacing:-.3px; margin:0; flex:1; display:flex; align-items:center; gap:9px; min-width:0}
.hello{font-size:13.5px; color:var(--muted); margin:-6px 0 12px; font-weight:500}
.h-bubble{flex:none; width:42px; height:42px; border-radius:14px; display:inline-flex; align-items:center; justify-content:center; padding:4px; --c:var(--lc,#ffa94d); --cd:var(--lcd,#f0582b); background:color-mix(in srgb,var(--c) 22%,var(--card)); overflow:hidden}
.h-bubble .art-photo{border-radius:10px}
.top .back{font-size:22px; padding:4px 10px 4px 0}
.iconbtn{font-size:20px; padding:6px 10px; border-radius:10px; color:var(--muted)}
.iconbtn:active{background:var(--chip)}
.iconbtn.small{font-size:16px; padding:2px 8px; display:inline-flex; align-items:center}
.iconbtn.small .ic{width:19px; height:19px}
.iconbtn.off{opacity:.35; filter:grayscale(1)}

.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.card{background:var(--card); border-radius:18px; box-shadow:var(--shadow); border:1px solid var(--border)}
.list-card{padding:12px 14px 14px; display:flex; flex-direction:column; min-height:172px; cursor:pointer; touch-action:manipulation; position:relative; overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,var(--card)),color-mix(in srgb,var(--c) 8%,var(--card)));
  border-color:color-mix(in srgb,var(--c) 30%,var(--border));
  box-shadow:0 4px 14px color-mix(in srgb,var(--c) 22%,transparent)}
.list-card::after{content:''; position:absolute; right:-26px; top:-26px; width:86px; height:86px; border-radius:50%; background:var(--c); opacity:.13; pointer-events:none}
.list-card:active{transform:scale(.98)}
.list-card{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.list-card img,.list-card svg{-webkit-user-drag:none; pointer-events:none}
.list-card.dragging{transform:scale(1.05) rotate(-1.5deg); box-shadow:0 16px 34px rgba(0,0,0,.28); cursor:grabbing; animation:none !important; transition:none}
.list-card.dragging .art-wrap{animation:none}
.drag-ph{background:transparent; border:2px dashed var(--border); box-shadow:none}
.lc-icon{font-size:30px; margin-bottom:8px; line-height:1}
.lc-photo{width:64px; height:64px; border-radius:12px; object-fit:cover; display:block; margin-bottom:2px}
.lc-name{font-weight:750; font-size:15.5px}
.lc-meta{font-size:12px; color:var(--muted); margin-top:3px}
.lc-repeat{font-size:11px; color:var(--cd); font-weight:700; margin-top:4px}
.repeat-badge{display:inline-block; font-size:12.5px; color:var(--accent); background:var(--accent-soft); padding:5px 12px; border-radius:12px; font-weight:600; margin-bottom:12px}
.lc-bar{height:7px; border-radius:4px; background:color-mix(in srgb,var(--c) 18%,var(--card)); margin-top:9px; overflow:hidden}
.lc-bar-fill{height:100%; border-radius:4px; background:linear-gradient(90deg,var(--c),var(--cd)); transition:width .3s}
.lc-bar-fill.full{background:linear-gradient(90deg,#51cf66,#2f9e44)}
.hdr-photo{width:26px; height:26px; border-radius:7px; object-fit:cover; vertical-align:-6px}
.add-card{border:2px dashed var(--border); color:var(--muted); background:color-mix(in srgb,var(--card) 50%,transparent); box-shadow:none; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
.add-card::after{display:none}
.chips{display:flex; flex-wrap:wrap; gap:8px; padding:2px 0 12px}
.chip{flex:none; padding:7px 14px; border-radius:20px; background:var(--chip); font-size:13px; font-weight:500}
.chip.on{background:var(--chip-on); color:#fff; font-weight:700; box-shadow:0 3px 10px color-mix(in srgb,var(--chip-on) 35%,transparent)}
.chip.add{background:transparent; border:1px dashed var(--muted); color:var(--muted)}
.cat-edit{display:inline-block; font-size:13px; color:var(--accent); background:var(--accent-soft); padding:7px 14px; border-radius:12px; margin:0 0 12px; font-weight:600}

.note{padding:13px 14px; margin-bottom:10px}
.n-title{font-weight:600; margin-bottom:4px}
.n-text{white-space:pre-wrap; word-break:break-word; line-height:1.45}
.n-text.clamp{display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.n-foot{display:flex; align-items:center; gap:8px; margin-top:9px}
.tag{font-size:11.5px; background:var(--accent-soft); color:var(--accent); padding:3px 9px; border-radius:12px; font-weight:600}
.chipbtn{font-size:12.5px; background:var(--chip); padding:4px 10px; border-radius:12px; font-weight:500}
.n-date{font-size:11.5px; color:var(--muted); margin-left:auto}

.det{padding:2px 2px 40px}
.det .tag{display:inline-block; margin-bottom:10px}
.det-title{font-size:21px; margin:6px 0 6px; line-height:1.25}
.det-date{font-size:12.5px; color:var(--muted); margin-bottom:16px}
.det-text{white-space:pre-wrap; word-break:break-word; line-height:1.6; font-size:16px}
.det-photos{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px}
.det-photo{width:calc(50% - 5px); border-radius:12px; object-fit:cover; aspect-ratio:1; cursor:pointer}
.det-remind{margin-top:20px; padding:11px 14px; background:var(--accent-soft); color:var(--accent); border-radius:12px; font-weight:600; font-size:14px}

.icon-pick{display:flex; gap:10px; align-items:center}
.icon-pick input{flex:1}

.cal-nav{display:flex; align-items:center; justify-content:space-between; margin:4px 0 14px}
.cal-title{font-weight:600; font-size:17px}
.cal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px}
.cal-head{margin-bottom:6px}
.cal-wd{text-align:center; font-size:11.5px; color:var(--muted); padding:2px 0}
.cal-cell{position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:10px; font-size:14px; color:var(--text); background:var(--chip); border:1px solid var(--border)}
.cal-cell.empty{background:transparent; border:none}
.cal-cell.today{border-color:var(--accent); color:var(--accent); font-weight:700}
.cal-cell.has{font-weight:600; color:var(--accent)}
.cal-cell .dot{position:absolute; bottom:6px; width:5px; height:5px; border-radius:50%; background:var(--accent)}

.cal-bar{display:flex; align-items:center; justify-content:space-between; width:100%; background:linear-gradient(100deg,color-mix(in srgb,#4dabf7 16%,var(--card)),color-mix(in srgb,#9775fa 14%,var(--card))); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:14px; padding:12px 16px; margin-bottom:12px; font-weight:600; font-size:14px; color:var(--text)}
.cal-bar-arr{color:var(--muted); font-size:20px}
.cal-bar:active{transform:scale(.99)}

.ci{display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:8px}
.ci .box{flex:none; width:24px; height:24px; border-radius:50%; border:2px solid var(--muted); display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff}
.ci .box{transition:transform .15s}
.ci.done .box{background:linear-gradient(135deg,var(--lc,#ff922b),var(--accent)); border-color:transparent}
.ci .box:active{transform:scale(.85)}
.ci .ci-text{flex:1; word-break:break-word}
.ci-more{font-size:11px; opacity:.6; margin-left:2px}
.ci.done .ci-text{text-decoration:line-through; color:var(--muted)}
.ci .tag{flex:none}
.progress{font-size:13px; color:var(--muted); padding:0 2px 10px}

.fab{position:fixed; right:calc(50% - 245px); bottom:24px; width:60px; height:60px; border-radius:20px;
  background:linear-gradient(135deg,var(--lc,#ff922b),var(--accent)); color:#fff; font-size:30px; box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent); z-index:5}
@media (max-width:548px){.fab{right:20px}}
.addbar{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--border); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); z-index:5}
.addbar .row{max-width:492px; margin:0 auto; display:flex; gap:8px}
.addbar input{flex:1; border:1px solid var(--border); background:var(--bg); border-radius:12px; padding:11px 13px; outline:none}
.addbar button{background:linear-gradient(135deg,var(--lc,#ff922b),var(--accent)); color:#fff; border-radius:12px; padding:0 18px; font-size:20px}
.addbar button.micbtn{background:var(--chip); color:var(--text); padding:0 14px; font-size:17px}
.micbtn.rec{background:var(--danger)!important; color:#fff!important; animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.55}}
.lbl-row{display:flex; align-items:center; justify-content:space-between}
.lbl-row .micbtn{font-size:16px; background:var(--chip); border-radius:10px; padding:5px 12px}

#overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:25; display:none; align-items:flex-end; justify-content:center}
#overlay.open{display:flex}
.sheet{background:var(--card); width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto}
.sheet h2{margin:0 0 14px; font-size:18px}
.sheet label{display:block; font-size:12.5px; color:var(--muted); margin:12px 0 5px; font-weight:600}
.sheet input[type=text], .sheet input[type=datetime-local], .sheet textarea{width:100%; border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:12px; padding:11px 13px; outline:none; color-scheme:light dark}
.sheet input[type=datetime-local]{min-height:44px}
.sheet textarea{min-height:110px; resize:vertical}
.sheet .hint{font-size:12.5px; color:var(--muted); line-height:1.45; margin-top:8px}
.btn{display:block; width:100%; text-align:center; background:linear-gradient(135deg,var(--lc,#ff922b),var(--accent)); color:#fff; border-radius:13px; padding:14px; font-weight:600; font-size:15px; margin-top:16px}
.btn.gray{background:var(--chip); color:var(--text)}
.btn.danger{background:transparent; color:var(--danger); padding:12px}
.cat-row{padding:12px 4px; border-bottom:1px solid var(--border)}
.cat-row-top{display:flex; align-items:center; justify-content:space-between}
.swatches{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
.sw{width:26px; height:26px; border-radius:50%; border:2px solid transparent}
.sw.on{border-color:var(--text); transform:scale(1.12)}
.lc-sw{display:flex; flex-wrap:wrap; gap:9px; margin-top:4px}
.lc-sw button{width:34px; height:34px; border-radius:11px; border:3px solid transparent}
.lc-sw button.on{border-color:var(--text); transform:scale(1.08)}
.sw.custom{background:conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.sw.none{background:var(--chip); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--muted)}
.preview-line{font-size:13px; color:var(--muted); margin-top:16px; display:flex; align-items:center; gap:8px}
.sheet label.switch{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--text); font-weight:500; margin:18px 0 0}
.sheet label.switch input{width:20px; height:20px; margin:0}
.action{display:block; width:100%; text-align:left; padding:14px 6px; font-size:16px; border-bottom:1px solid var(--border)}
.action:last-child{border-bottom:none}
.action.danger{color:var(--danger)}
.thumbs{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.thumb{position:relative; width:64px; height:64px; border-radius:10px; overflow:hidden; border:1px solid var(--border)}
.thumb img{width:100%; height:100%; object-fit:cover}
.thumb .rm{position:absolute; top:0; right:0; background:rgba(0,0,0,.55); color:#fff; width:20px; height:20px; font-size:12px; border-radius:0 0 0 8px}
.addphoto{width:64px; height:64px; border-radius:10px; border:1px dashed var(--muted); color:var(--muted); font-size:22px}

#viewer{position:fixed; inset:0; background:rgba(0,0,0,.93); z-index:20; display:none; flex-direction:column}
#viewer.open{display:flex}
#viewer .v-top{display:flex; align-items:center; color:#ddd; padding:14px 16px; font-size:14px}
#viewer .v-top .cnt{flex:1}
#viewer .v-top button{color:#fff; font-size:20px; padding:4px 12px}
#viewer .v-img{flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:0 8px}
#viewer img{max-width:100%; max-height:100%; object-fit:contain}
#viewer .v-nav{display:flex; justify-content:space-between; padding:14px 22px calc(20px + env(safe-area-inset-bottom))}
#viewer .v-nav button{color:#fff; font-size:26px; padding:4px 18px}

.empty{text-align:center; color:var(--muted); padding:44px 20px; line-height:1.6}
.empty .big{font-size:40px; display:block; margin-bottom:10px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:100px; background:var(--text); color:var(--bg);
  padding:10px 18px; border-radius:20px; font-size:14px; z-index:30; opacity:0; transition:opacity .25s; pointer-events:none; max-width:85%}
.toast.show{opacity:1}

/* поиск: шапка с поиском прилипает к верху; отрицательный отступ гасит верхний отступ #app, чтобы фон закрывал и «чёлку» */
.stick{position:sticky; top:0; z-index:4; background:color-mix(in srgb,var(--bg) 72%,transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  margin:calc(-12px - env(safe-area-inset-top)) calc(-14px - env(safe-area-inset-right)) 0 calc(-14px - env(safe-area-inset-left));
  padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left))}
.stick .top{padding-bottom:8px}
.stick > .top:last-child{padding-bottom:14px}
.search{position:relative; padding-bottom:12px}
.search input{width:100%; border:1px solid var(--border); background:var(--card); border-radius:12px; padding:10px 38px 10px 36px; outline:none; box-shadow:var(--shadow); -webkit-appearance:none; appearance:none}
.search input:focus{border-color:var(--accent)}
.search input::-webkit-search-cancel-button{display:none}
.search .s-ico{position:absolute; left:12px; top:11px; color:var(--muted); pointer-events:none; display:flex}
.search .s-ico .ic{width:19px; height:19px}
.search .s-clr{position:absolute; right:6px; top:6px; width:30px; height:30px; border-radius:50%; color:var(--muted); display:none; align-items:center; justify-content:center}
.search .s-clr .ic{width:17px; height:17px}
.search.has .s-clr{display:flex}
.s-count{font-size:12.5px; color:var(--muted); padding:0 2px 10px}
.s-where{font-size:12px; color:var(--muted); margin-bottom:5px}
mark{background:var(--accent-soft); color:var(--accent); border-radius:4px; padding:0 2px; font-weight:600}

/* значки */
.ic{width:1.2em; height:1.2em; vertical-align:-.24em; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.ic.b{stroke-width:2.6}
.iconbtn .ic{width:22px; height:22px; vertical-align:middle}
.top .back{display:flex; align-items:center} .top .back .ic{width:26px; height:26px; stroke-width:2.4}
.act-ic{display:inline-flex; width:32px; height:32px; border-radius:10px; align-items:center; justify-content:center; margin-right:12px; vertical-align:middle;
  color:var(--ac); background:color-mix(in srgb,var(--ac) 15%,var(--card))}
.act-ic .ic{width:18px; height:18px; vertical-align:0}
.action{display:flex !important; align-items:center}
.chip .ic{width:14px; height:14px; vertical-align:-2px; stroke-width:3}
.chip.add .ic{width:15px; height:15px}
.ci .box .ic{width:15px; height:15px; stroke:#fff; stroke-width:3.4}
.fab .ic{width:28px; height:28px; stroke-width:2.6; vertical-align:middle}
.addbar button .ic{width:22px; height:22px; stroke-width:2.6; vertical-align:middle}
.hello .ic{width:16px; height:16px; color:var(--accent); vertical-align:-3px; margin-left:2px}
.big-ic{display:flex; width:84px; height:84px; margin:0 auto 14px; border-radius:28px; align-items:center; justify-content:center; color:var(--accent); background:var(--accent-soft)}
.big-ic .ic{width:40px; height:40px}
.thumb .rm{display:flex; align-items:center; justify-content:center} .thumb .rm .ic{width:13px; height:13px}
.sw.none .ic{width:14px; height:14px}
#viewer button .ic{width:24px; height:24px}
.cal-bar-arr{display:flex}
.spin{animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
.sync-ok{color:#2f9e44} .sync-err{color:var(--danger)}
/* анимации: появление плиток по очереди, лёгкое покачивание картинок, мерцание, сердце, пар, галочка */
@keyframes tileIn{from{opacity:0; transform:translateY(16px) scale(.96)}to{opacity:1; transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-1.5deg)}}
@keyframes twinkle{0%,100%{transform:scale(1); opacity:1}50%{transform:scale(.55); opacity:.55}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.07)}24%{transform:scale(.98)}36%{transform:scale(1.04)}}
@keyframes steam{0%{stroke-dashoffset:0; opacity:.9}100%{stroke-dashoffset:-48; opacity:.9}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.45}}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes slideIn{from{opacity:0; transform:translateX(18px)}to{opacity:1; transform:none}}
@keyframes rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
@keyframes sheetUp{from{transform:translateY(40px); opacity:.4}to{transform:none; opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#app.enter .grid > .list-card{animation:tileIn .5s cubic-bezier(.2,.9,.3,1.2) both}
#app.enter .grid > .list-card:nth-child(2){animation-delay:.05s} #app.enter .grid > .list-card:nth-child(3){animation-delay:.1s}
#app.enter .grid > .list-card:nth-child(4){animation-delay:.15s} #app.enter .grid > .list-card:nth-child(5){animation-delay:.2s}
#app.enter .grid > .list-card:nth-child(6){animation-delay:.25s} #app.enter .grid > .list-card:nth-child(7){animation-delay:.3s}
#app.enter .grid > .list-card:nth-child(8){animation-delay:.35s} #app.enter .grid > .list-card:nth-child(n+9){animation-delay:.4s}
#app.enter .cal-bar{animation:rise .4s ease both}
#app.enter.sub #results > *, #app.enter.sub .det, #app.enter.sub .chips{animation:slideIn .32s ease both}
#app.enter.sub #results > :nth-child(2){animation-delay:.03s} #app.enter.sub #results > :nth-child(3){animation-delay:.06s}
#app.enter.sub #results > :nth-child(4){animation-delay:.09s} #app.enter.sub #results > :nth-child(n+5){animation-delay:.12s}
.lc-art .art-wrap{animation:floaty 4.5s ease-in-out infinite}
.list-card:nth-child(2n) .lc-art .art-wrap{animation-delay:-1.5s} .list-card:nth-child(3n) .lc-art .art-wrap{animation-delay:-3s}
.art .spk{transform-box:fill-box; transform-origin:center; animation:twinkle 2.4s ease-in-out infinite}
.art .spk:nth-of-type(2n){animation-delay:-1.2s}
.art .beat{transform-box:fill-box; transform-origin:center; animation:beat 2.2s ease-in-out infinite}
.art .steam{stroke-dasharray:8 8; animation:steam 2.2s linear infinite}
.art .glow,.art .rays{animation:glow 2.6s ease-in-out infinite}
.art-pick .art *,.mini-art .art *{animation:none !important}
.ci .box.pop{animation:pop .38s cubic-bezier(.2,.9,.3,1.4)}
.list-card:active .lc-art{transform:scale(1.06) rotate(-3deg); transition:transform .15s}
#overlay.open{animation:fadeIn .2s ease}
#overlay.open .sheet{animation:sheetUp .28s cubic-bezier(.2,.9,.3,1.1)}
.empty .big-art,.empty .big-ic{animation:rise .5s ease both}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important; transition:none !important}}
/* рисунки плиток */
.art{display:block; width:100%; height:100%; overflow:visible}
.art .f1{fill:var(--c)} .art .f2{fill:var(--cd)} .art .fw{fill:#fff}
.art .fs{fill:color-mix(in srgb,var(--c) 32%,#fff)} .art .fy{fill:#ffd665} .art .fp{fill:#ff9fb6}
.art .fg{fill:#5cc36a} .art .fg2{fill:#94dc6c} .art .ft{fill:#f4a36a}
.art .fo{fill:var(--cd); opacity:.16} .art .hl{fill:#fff; opacity:.5}
.art .ol{stroke:color-mix(in srgb,var(--cd) 22%,transparent); stroke-width:2}
.art .st{fill:none; stroke:var(--cd); stroke-width:7; stroke-linecap:round}
.art .sk{fill:none; stroke:#fff; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round}
.art .sy{fill:none; stroke:#ffd665; stroke-width:5; stroke-linecap:round}
.art .sy2{fill:none; stroke:#f5b83d; stroke-width:3}
.art .ss{fill:none; stroke:color-mix(in srgb,var(--c) 45%,#fff); stroke-width:5; stroke-linecap:round}
.art .rs{stroke:var(--c); stroke-width:9; stroke-linejoin:round}
.art-wrap{display:block; width:100%; height:100%}
.art-photo{display:block; width:100%; height:100%; object-fit:cover; border-radius:22%}

.lc-art{width:96px; height:96px; margin:-4px -8px 4px auto; position:relative; z-index:1; filter:drop-shadow(0 6px 10px color-mix(in srgb,var(--cd) 22%,transparent))}
.lc-art .art-photo{border-radius:24px}
.add-card .lc-art{width:64px; height:64px; margin:6px auto 10px; filter:none; display:flex; align-items:center; justify-content:center; font-size:30px; border-radius:20px; background:var(--chip); color:var(--muted)}
.mini-art{display:inline-block; width:18px; height:18px; vertical-align:-4px; margin-right:3px}
.mini-art .art-photo{border-radius:5px}
.big-art{display:block; width:96px; height:96px; margin:0 auto 12px; --c:var(--lc,#ffa94d); --cd:var(--lcd,#f0582b)}
.art-pick{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:4px}
.art-pick button{aspect-ratio:1; border-radius:14px; padding:5px; background:color-mix(in srgb,var(--c) 14%,var(--card)); border:2.5px solid transparent}
.art-pick button.on{border-color:var(--cd); background:color-mix(in srgb,var(--c) 28%,var(--card))}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="viewer"></div>
<div id="toast" class="toast"></div>

<script>
/* ---------- база ---------- */
const APP_VER='3.3';
const DB_NAME='bloknot', DB_VER=1;
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=e=>{const d=e.target.result;
    d.createObjectStore('lists',{keyPath:'id'});
    const n=d.createObjectStore('notes',{keyPath:'id'}); n.createIndex('listId','listId');
    d.createObjectStore('photos',{keyPath:'id'});
    d.createObjectStore('meta',{keyPath:'key'});
  };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
})}
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error)});
const st=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const rawPut=(s,v)=>req(st(s,'readwrite').put(v));
const rawDel=(s,k)=>req(st(s,'readwrite').delete(k));
// списки и записи синхронизируются: при записи ставим время правки, при удалении оставляем «надгробие»
const SYNCED=new Set(['lists','notes']);
const dbPut=(s,v)=>{if(SYNCED.has(s)){v.updatedAt=Date.now(); syncSoon()} return rawPut(s,v)};
const dbDel=async(s,k)=>{if(SYNCED.has(s)){await addTomb(k); syncSoon()} return rawDel(s,k)};
const dbGet=(s,k)=>req(st(s).get(k));
const dbAll=s=>req(st(s).getAll());
const dbByList=id=>req(st('notes').index('listId').getAll(id));
const dbClear=s=>req(st(s,'readwrite').clear());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- утилиты ---------- */
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural=(n,a,b,c)=>{n=Math.abs(n)%100; const d=n%10; if(n>10&&n<20)return c; if(d>1&&d<5)return b; if(d===1)return a; return c};
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_NOM=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
function fmtDate(ts){
  const d=new Date(ts), now=new Date(), y=new Date(now); y.setDate(now.getDate()-1);
  if(sameDay(d,now))return 'сегодня';
  if(sameDay(d,y))return 'вчера';
  const dd=d.getDate().toString().padStart(2,'0'), mm=(d.getMonth()+1).toString().padStart(2,'0');
  return d.getFullYear()===now.getFullYear()?`${dd}.${mm}`:`${dd}.${mm}.${d.getFullYear()}`;
}
function fmtFull(ts){
  const d=new Date(ts);
  const hh=d.getHours().toString().padStart(2,'0'), mi=d.getMinutes().toString().padStart(2,'0');
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ${hh}:${mi}`;
}
const pad2=n=>String(n).padStart(2,'0');
function fmtRemind(ts){
  const d=new Date(ts);
  return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function toLocalInput(ts){
  const d=new Date(ts);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function toICS(d){return d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate())+'T'+pad2(d.getUTCHours())+pad2(d.getUTCMinutes())+'00Z'}
function escICS(s){return String(s||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\r?\n/g,'\\n')}
function buildICS(note){
  const start=new Date(note.remindAt);
  const title=(note.title||note.text||'Напоминание').slice(0,150);
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//bloknot//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT','UID:'+note.id+'@bloknot','DTSTAMP:'+toICS(new Date()),
    'DTSTART:'+toICS(start),'DTEND:'+toICS(new Date(note.remindAt+30*60000)),
    'SUMMARY:'+escICS(title),'DESCRIPTION:'+escICS(note.text||''),
    'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:PT0M','DESCRIPTION:'+escICS(title),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
}
async function addToCalendar(note){
  const ics=buildICS(note);
  const title=(note.title||note.text||'Напоминание').slice(0,150);
  const blob=new Blob([ics],{type:'text/calendar'});
  // 1) системный «Поделиться» файлом — если поддерживается
  try{
    const file=new File([blob],'napominanie.ics',{type:'text/calendar'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title});
      return;
    }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  // 2) прямой переход к событию — рабочий путь для установленного приложения на iOS
  const url=URL.createObjectURL(blob);
  location.href=url;
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}
async function addToCalendarById(id){const n=await dbGet('notes',id); if(n&&n.remindAt)addToCalendar(n)}
function clearRemind(){const el=document.getElementById('e-remind'); if(el){el.value=''; toast('Напоминание убрано (не забудь сохранить)')}}
const CAT_COLORS=['#e03131','#e8590c','#2f9e44','#1971c2','#7048e8','#c2255c'];
const CAT_GRADS=['linear-gradient(135deg,#f6416c,#ff9a9e)','linear-gradient(135deg,#fda085,#f6d365)',
  'linear-gradient(135deg,#43e97b,#38f9d7)','linear-gradient(135deg,#4facfe,#00f2fe)',
  'linear-gradient(135deg,#a18cd1,#fbc2eb)','linear-gradient(135deg,#30cfd0,#330867)'];
function catColor(l,name){return (l&&l.catColors&&l.catColors[name])||''}
// цвета плиток: [яркий, глубокий]; без выбранного цвета — по радуге в порядке плиток
const TILE_COLORS=[['#ff8787','#e03131'],['#ffa94d','#e8590c'],['#ffd43b','#e67700'],['#a9e34b','#5c940d'],['#69db7c','#2f9e44'],
  ['#38d9a9','#099268'],['#4dabf7','#1971c2'],['#748ffc','#4263eb'],['#9775fa','#7048e8'],['#f783ac','#d6336c']];
function tileColor(l,idx){
  const i=Number.isInteger(l.color)?l.color:((idx??l.order??0)%TILE_COLORS.length+TILE_COLORS.length)%TILE_COLORS.length;
  return TILE_COLORS[i]||TILE_COLORS[0];
}
async function listColor(l){
  if(Number.isInteger(l.color)) return tileColor(l);
  const lists=(await dbAll('lists')).sort((a,b)=>a.order-b.order);
  return tileColor(l,Math.max(0,lists.findIndex(x=>x.id===l.id)));
}
function applyListTheme(c){
  const r=document.documentElement;
  if(c){r.dataset.lc='1'; r.style.setProperty('--lc',c[0]); r.style.setProperty('--lcd',c[1])}
  else{delete r.dataset.lc; r.style.removeProperty('--lc'); r.style.removeProperty('--lcd')}
}
/* ---------- значки ---------- */
// тонкие линейные значки вместо эмодзи (контур — цветом текста вокруг)
const ICONS={
  search:'<circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>',
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
  pencil:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/>',
  refresh:'<path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/>',
  repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',

  checksq:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  save:'<path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7M7 3v4a1 1 0 0 0 1 1h7"/>',
  history:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5M12 7v5l3.5 2"/>',
  clock:'<circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3.5 2"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  eraser:'<path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7M5 11l9 9"/>',
  sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  sunrise:'<path d="M12 2v6M4.93 10.93l1.41 1.41M2 18h2M20 18h2M19.07 10.93l-1.41 1.41M22 22H2M8 6l4-4 4 4M16 18a4 4 0 0 0-8 0"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  sparkles:'<path d="M9.94 14.06 8.5 19l-1.44-4.94L2 12.5l5.06-1.44L8.5 6l1.44 5.06L15 12.5z"/><path d="M19 3v4M17 5h4M18 15v3M16.5 16.5h3"/>',
  chevL:'<path d="m15 18-6-6 6-6"/>',
  chevR:'<path d="m9 18 6-6-6-6"/>',
  more:'<circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/>',
  dots:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
};
const ic=(k,cls='')=>`<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]||''}</svg>`;
// значок в цветном квадратике — для пунктов меню
const actIc=(k,c)=>`<span class="act-ic" style="--ac:${c}">${ic(k)}</span>`;

/* ---------- картинки плиток ---------- */
// мягкие рисунки в цвет плитки: --c — яркий, --cd — глубокий (классы f1/f2/… — в стилях)
const SPK=(x,y,s=1)=>`<path class="fy spk" d="M${x} ${y-7*s}l${2.2*s} ${4.8*s} ${4.8*s} ${2.2*s}-${4.8*s} ${2.2*s}-${2.2*s} ${4.8*s}-${2.2*s}-${4.8*s}-${4.8*s}-${2.2*s} ${4.8*s}-${2.2*s}z"/>`;
const SH=(rx=34,cy=108)=>`<ellipse class="fo" cx="60" cy="${cy}" rx="${rx}" ry="5"/>`;
const ART={
  heart:{t:'Сердце', e:'❤️', s:SH()+`<path class="f1 beat" d="M60 100C26 78 14 56 22 40C29 26 48 24 60 40C72 24 91 26 98 40C106 56 94 78 60 100Z"/>
    <ellipse class="hl" cx="38" cy="45" rx="9" ry="5.5" transform="rotate(-38 38 45)"/>
    <path class="fp" d="M97 13c-4-5-12-2-10 5 1 4 5 7 10 10 5-3 9-6 10-10 2-7-6-10-10-5z"/>`+SPK(20,22)+SPK(104,52,.7)},
  check:{t:'Дела', e:'✅', s:SH(32)+`<rect class="f1" x="24" y="18" width="72" height="88" rx="14"/>
    <rect class="fw" x="31" y="28" width="58" height="70" rx="9"/><rect class="f2" x="44" y="11" width="32" height="15" rx="7"/>
    <circle class="f1" cx="43" cy="46" r="6.5"/><path class="sk" d="M39.8 46.2l2.3 2.3 4.4-4.6"/><rect class="fs" x="55" y="43" width="25" height="6" rx="3"/>
    <circle class="f1" cx="43" cy="64" r="6.5"/><path class="sk" d="M39.8 64.2l2.3 2.3 4.4-4.6"/><rect class="fs" x="55" y="61" width="19" height="6" rx="3"/>
    <circle class="fs" cx="43" cy="82" r="6.5"/><rect class="fs" x="55" y="79" width="23" height="6" rx="3"/>`+SPK(104,24)},
  work:{t:'Работа', e:'💼', s:SH(40)+`<path class="st" d="M46 38v-9a6 6 0 0 1 6-6h16a6 6 0 0 1 6 6v9"/>
    <rect class="f1" x="16" y="36" width="88" height="64" rx="15"/><rect class="f2" x="16" y="60" width="88" height="7" opacity=".3"/>
    <rect class="fy" x="51" y="54" width="18" height="18" rx="5"/><ellipse class="hl" cx="34" cy="46" rx="10" ry="4"/>`+SPK(104,20)},
  pill:{t:'Здоровье', e:'💊', s:SH(36)+`<g transform="rotate(-38 60 62)"><rect class="fw ol" x="20" y="44" width="80" height="36" rx="18"/>
    <path class="f1" d="M60 44h22a18 18 0 0 1 0 36H60z"/><ellipse class="hl" cx="78" cy="53" rx="9" ry="3"/></g>
    <circle class="f2" cx="27" cy="27" r="13"/><path class="sk" d="M27 20.5v13M20.5 27h13"/>
    <circle class="fp" cx="96" cy="94" r="9"/><rect class="fw" x="89.5" y="92.5" width="13" height="3" rx="1.5"/>`},
  bag:{t:'Покупки', e:'🛒', s:SH(38)+`<rect class="fy" x="66" y="12" width="13" height="46" rx="6.5" transform="rotate(16 72 35)"/>
    <path class="fg" d="M44 46c-10-12-4-28 8-32 4 13 0 24-8 32z"/><path class="fg2" d="M52 46c2-14 12-20 22-18-2 10-10 16-22 18z"/>
    <path class="f1" d="M20 44h80l-6 50a11 11 0 0 1-11 10H37a11 11 0 0 1-11-10z"/>
    <path class="st" d="M44 58V40a16 16 0 0 1 32 0v18"/><path class="sk" d="M50 76q10 8 20 0"/>
    <ellipse class="hl" cx="34" cy="56" rx="5" ry="9" transform="rotate(10 34 56)"/>`},
  people:{t:'Люди', e:'👥', s:SH(42)+`<circle class="f2" cx="78" cy="40" r="14"/><path class="f2" d="M54 98c0-19 10-31 24-31s24 12 24 31z"/>
    <circle class="f1" cx="46" cy="50" r="16"/><path class="f1" d="M18 106c0-21 12-35 28-35s28 14 28 35z"/>

    <path class="fp" d="M101 14c-3.5-4.5-10.5-2-9 4.5 1 3.5 4.5 6 9 9 4.5-3 8-5.5 9-9 1.5-6.5-5.5-9-9-4.5z"/>`},

/* ---------- поиск ---------- */
// ищет по словам: точное совпадение, начало слова (пока печатаешь), другая форма слова (молоко → молока),
// часть слова и опечатки (1 ошибка в словах от 4 букв, 2 — от 7). Все слова запроса должны найтись.
const normS=s=>String(s||'').toLowerCase().replace(/ё/g,'е');
const WORD_RE=/[a-zа-яё0-9]+/gi;
const sWords=s=>normS(s).match(WORD_RE)||[];
const ENDINGS=['иями','ями','ами','ого','его','ому','ему','ыми','ими','ией','ия','ья','ие','ье','ии','ая','яя','ое','ее','ые','ий','ый','ой','ом','ем','ам','ям','ах','ях','ую','юю','ов','ев','ей','ью','а','я','о','е','ы','и','у','ю','ь','й'];
function stem(w){
  if(w.length<4) return w;
  for(const e of ENDINGS) if(w.length-e.length>=3 && w.endsWith(e)) return w.slice(0,-e.length);
  return w;
}
// расстояние с перестановкой соседних букв; дальше max не считаем
function editDist(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  let p2=null, p=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const c=[i]; let rowMin=i;
    for(let j=1;j<=b.length;j++){
      let v=Math.min(p[j]+1, c[j-1]+1, p[j-1]+(a[i-1]===b[j-1]?0:1));
      if(p2&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) v=Math.min(v,p2[j-2]+1);
      c[j]=v; if(v<rowMin)rowMin=v;
    }
    if(rowMin>max) return max+1;
    p2=p; p=c;
  }
  return p[b.length];
}
const phon=w=>w.replace(/о/g,'а').replace(/[еэ]/g,'и').replace(/[ыя]/g,m=>m==='ы'?'и':'а');
function wordScore(q,w){
  if(w===q) return 10;
  if(w.startsWith(q)) return 8;
  const sq=stem(q);
  if(sq.length>=3 && stem(w)===sq) return 7;
  if(q.length>=3 && w.includes(q)) return 5;
  // пишут как слышат: «малако» → молоко, «симена» → семена
  if(q.length>=3 && phon(w).startsWith(phon(q))) return 5;
  if(q.length>=4){
    const tol=q.length>=7?2:1;
    if(editDist(q,w,tol)<=tol) return 4;
    if(w.length>q.length && editDist(q,w.slice(0,q.length),tol)<=tol) return 3;
  }
  return 0;
}
function bestScore(q,ws){let b=0; for(const w of ws){const s=wordScore(q,w); if(s>b){b=s; if(b===10)break}} return b}
function noteScore(n,qws){
  const tw=sWords(n.title), xw=sWords(n.text), cw=sWords(n.category);
  let total=0;
  for(const q of qws){
    const s=Math.max(bestScore(q,tw)*1.5, bestScore(q,xw), bestScore(q,cw)*.8);
    if(!s) return 0;
    total+=s;
  }
  return total;
}
function searchNotes(notes,query){
  const qws=sWords(query); if(!qws.length) return [];
  return notes.map(n=>({n, s:noteScore(n,qws)})).filter(r=>r.s>0)
    .sort((a,b)=>b.s-a.s || (a.n.done?1:0)-(b.n.done?1:0) || b.n.createdAt-a.n.createdAt).map(r=>r.n);
}
// подсветка найденных слов
function hl(text,qws){
  if(!qws||!qws.length) return esc(text);
  return String(text??'').split(/([a-zа-яё0-9]+)/i).map((part,i)=>{
    if(i%2===0) return esc(part);
    const w=normS(part);
    return qws.some(q=>wordScore(q,w)>0)?`<mark>${esc(part)}</mark>`:esc(part);
  }).join('');
}
// кусок длинного текста вокруг первого найденного слова, чтобы совпадение было видно
function snippet(text,qws){
  text=String(text||''); if(text.length<=160) return hl(text,qws);
  const re=/[a-zа-яё0-9]+/gi; let m, at=-1;
  while((m=re.exec(text))){const w=normS(m[0]); if(qws.some(q=>wordScore(q,w)>0)){at=m.index; break}}
  if(at<60) return hl(text,qws);
  return '…'+hl(text.slice(at-50),qws);
}

      <div class="lc-meta">${isCheck

      ${l.repeat?`<div class="lc-repeat">${ic('repeat')} ${REPEAT_LABEL[l.repeat]}</div>`:''}
      ${showBar?`<div class="lc-bar"><div class="lc-bar-fill ${pct===100?'full':''}" style="width:${pct}%"></div></div>`:''}
    </div></div>`}).join('')}
    <div class="card list-card add-card" onclick="openListEditor()">
      <div class="lc-art">${ic('plus')}</div><div class="lc-name">Новый список</div>

}

/* ---------- перетаскивание списков ---------- */
let suppressClick=false;
function initReorder(){
  const grid=document.querySelector('.grid'); if(!grid)return;
  grid.querySelectorAll('.list-card:not(.add-card)').forEach(card=>{
    card.addEventListener('pointerdown', e=>pressStart(e, card, grid));
  });
}
function pressStart(e, card, grid){
  if(e.pointerType==='mouse' && e.button!==0) return;
  const sx=e.clientX, sy=e.clientY;
  let moved=false;
  const timer=setTimeout(()=>{ if(!moved){ cleanup(); beginDrag(card, grid, sx, sy); } }, 300);
  const onMove=ev=>{ if(Math.hypot(ev.clientX-sx, ev.clientY-sy)>12){ moved=true; cleanup(); } };
  const onUp=()=>cleanup();
  function cleanup(){ clearTimeout(timer); document.removeEventListener('pointermove',onMove); document.removeEventListener('pointerup',onUp); document.removeEventListener('pointercancel',onUp); }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}
function beginDrag(card, grid, sx, sy){
  if(navigator.vibrate) navigator.vibrate(15);
  suppressClick=true;
  app.classList.remove('enter','sub');
  const origStyle=card.getAttribute('style')||'';
  // пока тащим — страница не прокручивается (иначе браузер обрывает перетаскивание)
  const noScroll=ev=>ev.preventDefault();
  document.addEventListener('touchmove', noScroll, {passive:false});
  window.getSelection&&window.getSelection().removeAllRanges();
  const rect=card.getBoundingClientRect();
  const offX=sx-rect.left, offY=sy-rect.top;
  // «дырка» на месте плитки
  const ph=document.createElement('div');
  ph.className='list-card drag-ph';
  ph.style.height=rect.height+'px';
  grid.insertBefore(ph, card);
  // поднимаем плитку из потока — едет под пальцем
  card.classList.add('dragging');
  Object.assign(card.style,{position:'fixed', margin:'0', width:rect.width+'px', height:rect.height+'px',
    left:rect.left+'px', top:rect.top+'px', zIndex:'30', pointerEvents:'none'});
  const posCard=(x,y)=>{ card.style.left=(x-offX)+'px'; card.style.top=(y-offY)+'px'; };
  // страницу не замораживаем через overflow: на айфоне это прыжок прокрутки; прокрутку держит noScroll
  // плавное расступание соседей (FLIP)
  const flip=fn=>{
    const kids=[...grid.children].filter(c=>c!==card);
    const first=new Map(kids.map(c=>[c, c.getBoundingClientRect()]));
    fn();
    kids.forEach(c=>{
      const a=first.get(c), b=c.getBoundingClientRect();
      const dx=a.left-b.left, dy=a.top-b.top;
      if(dx||dy){ c.style.transition='none'; c.style.transform=`translate(${dx}px,${dy}px)`;
        requestAnimationFrame(()=>{ c.style.transition='transform .18s ease'; c.style.transform=''; }); }
    });
  };
  let px=sx, py=sy, raf=0;
  const place=()=>{
    // ближайшая плитка по центру — без elementFromPoint (он ловит саму плитку под пальцем)
    const sibs=[...grid.querySelectorAll('.list-card:not(.add-card)')].filter(c=>c!==card&&c!==ph);
    let best=null, bestD=Infinity, after=false;
    for(const s of sibs){
      const r=s.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
      const d=Math.hypot(px-cx, py-cy);
      if(d<bestD){ bestD=d; best=s; after=(py>cy)||(Math.abs(py-cy)<r.height/2 && px>cx); }
    }
    if(best){
      const ref=after?best.nextSibling:best;
      if(ref!==ph && ref!==ph.nextSibling) flip(()=>grid.insertBefore(ph, ref));
    }
  };
  // палец у верхнего или нижнего края — страница сама едет, чтобы дотащить плитку далеко
  const edge=()=>{
    const stick=document.querySelector('.stick'), top=(stick?stick.getBoundingClientRect().bottom:0)+80, bot=innerHeight-90;
    let v=0;
    if(py<top) v=-Math.min(18,(top-py)/3+3);
    else if(py>bot) v=Math.min(18,(py-bot)/3+3);
    if(v){ const y0=scrollY; scrollBy(0,v); if(scrollY!==y0) place(); }
    raf=requestAnimationFrame(edge);
  };
  raf=requestAnimationFrame(edge);
  const move=ev=>{ px=ev.clientX; py=ev.clientY; posCard(px,py); place(); };
  const up=async ()=>{
    cancelAnimationFrame(raf);
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',up);
    document.removeEventListener('touchmove',noScroll);
    // плитка «приземляется» в дырку
    const t=ph.getBoundingClientRect();
    card.style.transition='left .18s ease, top .18s ease, transform .18s ease';
    card.style.transform='scale(1)';
    posCard(t.left+offX, t.top+offY);
    setTimeout(async()=>{
      grid.insertBefore(card, ph); ph.remove();
      card.classList.remove('dragging'); card.setAttribute('style',origStyle);
      const ids=[...grid.querySelectorAll('.list-card:not(.add-card)')].map(c=>c.dataset.id).filter(Boolean);
      for(let i=0;i<ids.length;i++){ const l=await dbGet('lists',ids[i]); if(l && l.order!==i){ l.order=i; await dbPut('lists',l); } }
      setTimeout(()=>{suppressClick=false;}, 60);
      // плитки уже стоят на своих местах — не перерисовываем страницу, чтобы она не прыгала
    }, 180);
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
}

function listResultsHtml(l,all){
  let notes=S.cat!=='all'?all.filter(n=>n.category===S.cat):all.slice();
  const isCheck=l.type==='check';
  if(S.ql.trim()){
    const qws=sWords(S.ql), found=searchNotes(notes,S.ql);
    if(!found.length) return `<div class="empty"><span class="big-ic">${ic('search')}</span>Ничего не нашлось${S.cat!=='all'?` в «${esc(S.cat)}» — выбери «Все»`:''}.<br>Попробуй другое слово или начало слова</div>`;
    return `<div class="s-count">Нашлось: ${found.length}</div>`+found.map(n=>isCheck?checkItemHtml(n,l,qws):noteHtml(n,l,qws)).join('');
  }
  if(isCheck) notes.sort((a,b)=>(a.done?1:0)-(b.done?1:0) || b.createdAt-a.createdAt);
  else notes.sort((a,b)=>b.createdAt-a.createdAt);
  return notes.length ? notes.map(n=>isCheck?checkItemHtml(n,l):noteHtml(n,l)).join('')
   : `<div class="empty"><span class="big-art">${l.photo?listArt(l):artSvg(artKey(l))}</span>Пока пусто.<br>${isCheck?'Добавь первый пункт внизу':'Нажми «+», чтобы добавить заметку'}</div>`;
}

/* ---------- календарь ---------- */
function openCalendar(){
  const now=new Date(); S.calYear=now.getFullYear(); S.calMonth=now.getMonth();
  S.screen='calendar'; closeModal(); history.pushState({s:'calendar'},''); render();
}
function calShift(delta){
  let m=S.calMonth+delta, y=S.calYear;
  if(m<0){m=11;y--} if(m>11){m=0;y++}
  S.calMonth=m; S.calYear=y; render();
}
async function renderCalendar(){
  const now=new Date();
  if(S.calYear==null){S.calYear=now.getFullYear(); S.calMonth=now.getMonth()}
  const y=S.calYear, m=S.calMonth;
  const notes=(await dbAll('notes')).filter(n=>n.remindAt);
  const marks={};
  notes.forEach(n=>{const d=new Date(n.remindAt); marks[y+'-'+m+'-'+d.getDate()]=marks[y+'-'+m+'-'+d.getDate()]|| (d.getFullYear()===y&&d.getMonth()===m)});
  const startDow=(new Date(y,m,1).getDay()+6)%7;
  const daysIn=new Date(y,m+1,0).getDate();
  const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const cells=[];
  for(let i=0;i<startDow;i++)cells.push('<div class="cal-cell empty"></div>');
  for(let d=1;d<=daysIn;d++){
    const has=notes.some(n=>{const dd=new Date(n.remindAt); return dd.getFullYear()===y&&dd.getMonth()===m&&dd.getDate()===d});
    const isToday=sameDay(new Date(y,m,d),now);
    cells.push(`<button class="cal-cell ${isToday?'today':''} ${has?'has':''}" onclick="openDay(${y},${m},${d})">${d}${has?'<span class="dot"></span>':''}</button>`);
  }
  app.innerHTML=`
  <div class="stick">
  <header class="top">
    <button class="back" onclick="history.back()">${ic('chevL')}</button>
    <h1><span class="h-bubble" style="--c:#748ffc;--cd:#4263eb">${artSvg('calendar')}</span>Календарь</h1><span style="width:36px"></span>
  </header>
  </div>
  <div class="cal-nav">
    <button class="iconbtn" onclick="calShift(-1)">${ic('chevL')}</button>
    <div class="cal-title">${MONTHS_NOM[m]} ${y}</div>
    <button class="iconbtn" onclick="calShift(1)">${ic('chevR')}</button>
  </div>
  <div class="cal-grid cal-head">${WD.map(w=>`<div class="cal-wd">${w}</div>`).join('')}</div>
  <div class="cal-grid">${cells.join('')}</div>
  <div class="hint" style="margin-top:16px">Точками отмечены дни с напоминаниями. Нажми день, чтобы увидеть записи.</div>`;
}
async function openDay(y,m,d){
  const notes=(await dbAll('notes')).filter(n=>{
    if(!n.remindAt)return false; const dd=new Date(n.remindAt);
    return dd.getFullYear()===y&&dd.getMonth()===m&&dd.getDate()===d;
  }).sort((a,b)=>a.remindAt-b.remindAt);
  if(!notes.length){toast('В этот день напоминаний нет'); return}
  const rows=[];
  for(const n of notes){
    const l=await dbGet('lists',n.listId);
    const dt=new Date(n.remindAt);
    rows.push(`<button class="action" onclick="closeModal();jumpToNote('${n.id}')">
      ${ic('bell')} ${pad2(dt.getHours())}:${pad2(dt.getMinutes())} · ${esc((n.title||n.text||'').slice(0,40))}
      <div class="hint" style="margin:3px 0 0">${l?`<span class="mini-art">${listArt(l,await listColor(l))}</span>${esc(l.name)}`:''}</div></button>`);
  }
  showModal(`<h2>${d} ${MONTHS[m]} ${y}</h2>${rows.join('')}`);
}
async function jumpToNote(id){
  const n=await dbGet('notes',id); if(!n)return;
  S.listId=n.listId; openNote(id);
}

function openNote(id){S.noteId=id; S.screen='note'; history.pushState({s:'note',listId:S.listId,noteId:id},''); render()}

/* ---------- действия с записями ---------- */
let justDone=null;
async function toggleDone(id){const n=await dbGet('notes',id); n.done=!n.done; await dbPut('notes',n); justDone=n.done?id:null; await render(); justDone=null}
async function quickAdd(){
  const inp=document.getElementById('quick'); const val=inp.value.trim(); if(!val)return;
  await dbPut('notes',{id:uid(), listId:S.listId, title:val, text:'', category:S.cat!=='all'?S.cat:'', done:false, photos:[], createdAt:Date.now()});
  inp.value=''; render(); setTimeout(()=>{const q=document.getElementById('quick'); if(q)q.focus()},50);
}
async function deleteNote(id){
  const n=await dbGet('notes',id);
  for(const p of (n.photos||[])) await dbDel('photos',p);
  await dbDel('notes',id); closeModal(); render(); toast('Удалено');
}

/* ---------- голосовой ввод ---------- */
let rec=null, recBtn=null;
function micSupported(){return 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window}
function toggleMic(targetId, btn){
  if(rec){rec.stop(); return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  rec=new SR(); recBtn=btn;
  rec.lang='ru-RU'; rec.continuous=true; rec.interimResults=false;
  rec.onresult=e=>{
    const el=document.getElementById(targetId); if(!el)return;
    let t=''; for(let i=e.resultIndex;i<e.results.length;i++) t+=e.results[i][0].transcript;
    el.value=(el.value?el.value.trimEnd()+' ':'')+t.trim();
  };

async function compress(file, max=1400, q=.82){
  const img=await createImageBitmap(file);
  let w=img.width, h=img.height;
  if(Math.max(w,h)>max){const k=max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k)}
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  return c.toDataURL('image/jpeg',q);
}

  if(editCat.orig && editCat.orig!==name){

  el.classList.add('on');

const REPEAT_LABEL={daily:'каждый день', weekly:'каждую неделю', monthly:'каждый месяц'};
function periodKey(repeat, d=new Date()){
  if(repeat==='daily') return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  if(repeat==='weekly'){const t=new Date(d); const dow=(t.getDay()+6)%7; t.setDate(t.getDate()-dow); return 'W'+t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate());}
  if(repeat==='monthly') return d.getFullYear()+'-'+pad2(d.getMonth()+1);
  return '';
}
async function applyRepeatReset(l){
  if(!l.repeat) return false;
  const key=periodKey(l.repeat);
  if(l.repeatKey===key) return false;
  const notes=await dbByList(l.id);
  for(const n of notes) if(n.done){ n.done=false; await dbPut('notes',n); }
  l.repeatKey=key; await dbPut('lists',l);
  return true;
}
async function saveList(listId){

  const art=editArt&&ART[editArt]?editArt:null;

  if(listId){
    const l=await dbGet('lists',listId);
    Object.assign(l,{name,categories,photo:listPhoto||null,color:pickedColor()??l.color});
    if(art&&art!==artKey(l)){l.art=art; l.icon=ART[art].e}
    const pg=document.getElementById('l-progress');
    if(pg) l.hideProgress=!pg.checked;
    const rp=document.querySelector('#l-repeat .chip.on');
    if(rp){ const nv=rp.dataset.r||null; l.repeat=nv; l.repeatKey=nv?periodKey(nv):null; }
    await dbPut('lists',l);
  }else{
    const type=document.querySelector('#l-type .chip.on').dataset.t;
    const lists=await dbAll('lists');
    const id=uid();
    // картинку не выбрали — подберётся по названию
    const color=pickedColor();
    await dbPut('lists',{id, name, icon:art?ART[art].e:'', art, type, categories, photo:listPhoto||null, color:color??lists.length%TILE_COLORS.length, order:lists.length, createdAt:Date.now()});

}

    const resp=await fetch('./index.html',{cache:'reload'});
    if(!resp.ok) throw 0;
    if(window.caches){const ks=await caches.keys(); for(const k of ks) await caches.delete(k)}
    if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations(); for(const r of rs) await r.unregister()}
    location.reload();
  }catch(e){toast('Не получилось скачать — попробуй позже')}
}
function openImport(){
  showModal(`
    <h2>Импорт от Клода</h2>
    <div class="hint">Вставь сюда то, что прислал Клод. Если запись с таким заголовком в списке уже есть — она обновится, а не задвоится.<br><br>
    <b>Карточки</b> (например, из медкарты):<br>
    <code>Список: Болезни<br>Категория: Даша<br>=== Ангина<br>⚡ Что делать сейчас: …</code><br><br>
    <b>JSON:</b> <code>{"список":"Болезни","заголовок":"Ангина","текст":"..."}</code>,
    для чек-листа <code>{"список":"Поездка","пункты":["паспорт","зарядка"]}</code>. Можно массив из нескольких.</div>
    <label>Вставь сюда</label>
    <textarea id="imp-text" placeholder="Список: …&#10;Категория: …&#10;=== Заголовок&#10;текст"></textarea>
    <button class="btn" onclick="doImport()">Импортировать</button>`);
}
// карточки «=== Заголовок» + текст; сверху необязательные строки «Список: …» и «Категория: …»
function parseCards(t){
  if(!/^===/m.test(t)) return null;
  const parts=t.split(/^===[ \t]*/m), head=parts.shift();
  const hv=re=>{const m=head.match(re); return m?m[1].trim():''};
  const list=hv(/^\s*Список:\s*(.+)$/im)||'Болезни', category=hv(/^\s*Категория:\s*(.+)$/im);
  return parts.map(b=>{
    const i=b.indexOf('\n'), title=(i<0?b:b.slice(0,i)).trim();
    const text=(i<0?'':b.slice(i+1)).trim()
      .replace(/:\n\s*\n\* /g,':\n• ').replace(/\n\s*[*-] /g,'\n• ')
      .replace(/\[([^\]]+)\]\(mailto:[^)]+\)/g,'$1').replace(/\n{2,}/g,'\n');
    return {'список':list, 'заголовок':title, 'текст':text, 'категория':category};
  }).filter(c=>c['заголовок']&&c['текст']);
}
async function doImport(){
  let t=document.getElementById('imp-text').value.trim();
  t=t.replace(/^```(json|text)?/i,'').replace(/```$/,'').trim();
  let data;
  try{data=JSON.parse(t)}catch(e){data=parseCards(t)}
  if(!data||(Array.isArray(data)&&!data.length)){toast('Не понял формат — нужен JSON или карточки «=== Заголовок»'); return}
  if(!Array.isArray(data))data=[data];
  let added=0, updated=0;
  const norm=s=>String(s||'').replace(/\s+/g,' ').trim().toLowerCase();
  for(const raw of data){
    const listName=raw['список']||raw.list||'Заметки';
    const title=raw['заголовок']||raw.title||'';
    const text=raw['текст']||raw.text||'';
    const category=raw['категория']||raw.category||'';
    const items=raw['пункты']||raw.items;
    const lists=await dbAll('lists');
    let l=lists.find(x=>x.name.toLowerCase()===String(listName).toLowerCase());
    if(!l){
      l={id:uid(), name:listName, icon:items?'🧳':'📄', type:items?'check':'notes', categories:[], order:lists.length, createdAt:Date.now()};
      await dbPut('lists',l);
    }
    if(category&&!(l.categories||[]).includes(category)){l.categories=[...(l.categories||[]),category]; await dbPut('lists',l)}
    if(items&&Array.isArray(items)){
      for(const it of items){await dbPut('notes',{id:uid(), listId:l.id, text:String(it), title:'', category, photos:[], done:false, createdAt:Date.now()}); added++}
    }else if(text||title){
      // запись с тем же заголовком (и той же категорией, если она указана) — обновляем, а не плодим копию
      const same=title&&(await dbByList(l.id)).find(n=>norm(n.title)===norm(title)&&(!category||n.category===category));
      if(same){Object.assign(same,{text:String(text)}); if(category)same.category=category; await dbPut('notes',same); updated++}
      else{await dbPut('notes',{id:uid(), listId:l.id, text:String(text), title:String(title), category, photos:[], done:false, createdAt:Date.now()}); added++}
    }
  }
  closeModal(); render(); toast(updated?`Добавлено: ${added}, обновлено: ${updated}`:`Добавлено записей: ${added}`);
}
async function exportAll(){
  const data={version:1, exportedAt:new Date().toISOString(),
    lists:await dbAll('lists'), notes:await dbAll('notes'), photos:await dbAll('photos')};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='bloknot-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  closeModal(); toast('Копия сохранена в загрузки');
}
async function restoreAll(file){
  if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(!data.lists)throw 0;
    await dbClear('lists'); await dbClear('notes'); await dbClear('photos');
    for(const l of data.lists)await dbPut('lists',l);
    for(const n of data.notes||[])await dbPut('notes',n);
    for(const p of data.photos||[])await dbPut('photos',p);
    await dbPut('meta',{key:'seeded',value:1});
    closeModal(); S.screen='home'; render(); toast('Данные восстановлены');
  }catch(e){toast('Файл не похож на копию блокнота')}
}

/* ---------- синхронизация с GitHub: закрытый репозиторий (dela), файл data/bloknot.json ---------- */
// Тот же файл ведёт Клод в чате «Дела». Слияние по записям: побеждает более свежая правка (updatedAt),
// удаление — «надгробие» в deleted. Фото лежат отдельными файлами data/photos/<id>.jpg.
const SYNC_FILE='data/bloknot.json', SYNC_PHOTOS='data/photos/';
let syncCfg=null, syncTimer=null;
const SY={busy:false, again:false, last:0, err:''};
const stamp=x=>x.updatedAt||x.createdAt||0;
const byId=a=>[...a].sort((x,y)=>x.id<y.id?-1:x.id>y.id?1:0);
const b64enc=s=>{const b=new TextEncoder().encode(s); let o=''; for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(o)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));

async function loadSyncCfg(){const m=await dbGet('meta','sync'); syncCfg=m&&m.value&&m.value.token?m.value:null}
function syncSoon(ms=2500){if(!syncCfg)return; clearTimeout(syncTimer); syncTimer=setTimeout(syncNow,ms)}
async function addTomb(id){const m=await dbGet('meta','deleted'); const v=m?m.value:[]; v.push({id,at:Date.now()}); await rawPut('meta',{key:'deleted',value:v})}
function syncIcon(){return !syncCfg?ic('cloud'):SY.busy?ic('refresh','spin'):SY.err?ic('alert','sync-err'):ic('cloudok','sync-ok')}
function syncStatusText(){
  if(!syncCfg) return 'Сейчас выключена';
  if(SY.busy) return ic('refresh','spin')+' Синхронизирую…';
  if(SY.err) return ic('alert','sync-err')+' '+esc(SY.err);
  return SY.last?ic('cloudok','sync-ok')+' Синхронизировано: '+fmtFull(SY.last):'Ещё не синхронизировалось';
}
function setSync(p){
  Object.assign(SY,p);
  const b=document.getElementById('sync-ind'); if(b){b.innerHTML=syncIcon(); b.classList.toggle('off',!syncCfg)}
  const s=document.getElementById('sync-status'); if(s)s.innerHTML=syncStatusText();
}

async function gh(path, opt={}){
  return fetch((syncCfg.api||'https://api.github.com')+'/repos/'+syncCfg.repo+path,{
    method:opt.method||'GET', cache:'no-store',
    headers:{Authorization:'Bearer '+syncCfg.token, Accept:'application/vnd.github+json', ...(opt.body?{'Content-Type':'application/json'}:{})},
    body:opt.body?JSON.stringify(opt.body):undefined});
}
function ghFail(r){
  const m={401:'GitHub не принял токен — проверь, не истёк ли он',
    403:'У токена нет прав на запись — нужно Contents: Read and write',
    404:'Не нашёл репозиторий или файл — проверь название и доступ токена'};
  return new Error(m[r.status]||('GitHub ответил ошибкой '+r.status));
}
async function ghGet(path){ // → {b64, sha} или null, если файла нет
  const r=await gh('/contents/'+path);
  if(r.status===404) return null;
  if(!r.ok) throw ghFail(r);
  const j=await r.json();
  if(j.content) return {b64:j.content, sha:j.sha};
  const b=await gh('/git/blobs/'+j.sha); // файл больше 1 МБ — контент отдают только так
  if(!b.ok) throw ghFail(b);
  return {b64:(await b.json()).content, sha:j.sha};
}

function mergeData(remote, local){
  const cp=o=>JSON.parse(JSON.stringify(o||[]));
  const tomb=new Map();
  for(const t of [...cp(remote.deleted),...cp(local.deleted)]) if(!(tomb.get(t.id)>=t.at)) tomb.set(t.id,t.at);
  const pick=(a,b)=>{
    const m=new Map(a.map(x=>[x.id,x]));
    for(const x of b){const y=m.get(x.id); if(!y||stamp(x)>stamp(y)) m.set(x.id,x)}
    return [...m.values()].filter(x=>!(tomb.get(x.id)>=stamp(x)));
  };
  const lists=pick(cp(remote.lists),cp(local.lists)), notes=pick(cp(remote.notes),cp(local.notes));
  // одноимённые списки (например, «Дела» с телефона и из файла) склеиваем в один — тот, что уже в файле
  const inRemote=new Set((remote.lists||[]).map(l=>l.id)), now=Date.now();
  lists.sort((a,b)=>(inRemote.has(b.id)-inRemote.has(a.id))||(a.createdAt||0)-(b.createdAt||0));
  const byName=new Map(), keep=[];
  for(const l of lists){
    const k=String(l.name).trim().toLowerCase(), main=byName.get(k);
    if(!main){byName.set(k,l); keep.push(l); continue}
    main.categories=[...new Set([...(main.categories||[]),...(l.categories||[])])];
    if(l.catColors) main.catColors={...l.catColors,...(main.catColors||{})};
    if(!main.photo&&l.photo) main.photo=l.photo;
    main.updatedAt=now;
    for(const n of notes) if(n.listId===l.id){n.listId=main.id; n.updatedAt=now}
    tomb.set(l.id,now);
  }
  // записи удалённых списков уходят вместе со списком
  const ids=new Set(keep.map(l=>l.id));
  const alive=notes.filter(n=>{if(ids.has(n.listId))return true; tomb.set(n.id,now); return false});
  const old=now-180*864e5; // надгробия старше полугода больше не нужны
  const deleted=[...tomb].filter(([,at])=>at>old).map(([id,at])=>({id,at}));
  keep.sort((a,b)=>(a.order||0)-(b.order||0));
  return {lists:keep, notes:alive, deleted};
}

async function syncNow(manual){
  if(!syncCfg) return;
  if(SY.busy){SY.again=true; return}
  if(!navigator.onLine){setSync({err:'Нет интернета — догоню, когда появится'}); if(manual)toast(SY.err); return}
  clearTimeout(syncTimer);
  setSync({busy:true, again:false});
  try{
    let changed=false;
    for(let i=0;;i++){
      const r=await syncOnce();
      changed=changed||r.changed;
      if(r.ok) break;
      if(i>=3) throw new Error('Файл всё время меняется — попробую чуть позже');
    }
    setSync({busy:false, err:'', last:Date.now()});
    if(manual) toast('Синхронизировано');
    if(changed) softRender();
  }catch(e){
    setSync({busy:false, err:e instanceof TypeError?'Нет связи с GitHub':(e&&e.message)||'Не получилось'});
    if(manual) toast(SY.err);
  }
  if(SY.again) syncSoon(500);
}
async function syncOnce(){
  const got=await ghGet(SYNC_FILE);
  if(!got) throw ghFail({status:404});
  const remote=JSON.parse(b64dec(got.b64));
  const snap={lists:await dbAll('lists'), notes:await dbAll('notes'), deleted:((await dbGet('meta','deleted'))||{}).value||[]};
  const m=mergeData(remote, snap);
  // 1) в файл на GitHub — если есть что нового
  const same=(a,b)=>JSON.stringify(byId(a))===JSON.stringify(byId(b||[]));
  if(!same(m.lists,remote.lists)||!same(m.notes,remote.notes)||!same(m.deleted,remote.deleted)){
    const out={...remote, lists:m.lists, notes:m.notes, deleted:m.deleted, updatedAt:Date.now()};
    const r=await gh('/contents/'+SYNC_FILE,{method:'PUT',
      body:{message:'Дела: из Блокнота', content:b64enc(JSON.stringify(out,null,1)+'\n'), sha:got.sha}});
    if(r.status===409||r.status===422) return {ok:false}; // файл успели поменять — заходим заново
    if(!r.ok) throw ghFail(r);
  }
  // 2) к себе
  let changed=await applyLocal(m, snap);
  // 3) фото
  if(await syncPhotos(m.notes)) changed=true;
  return {ok:true, changed};
}
async function applyLocal(m, snap){
  let changed=false;
  for(const s of ['lists','notes']){
    const before=new Map(snap[s].map(x=>[x.id,x])), keep=new Set();
    // если запись поменяли, пока шёл обмен с GitHub, — не трогаем, она уйдёт следующим заходом
    const touched=async(old,id)=>{const cur=await dbGet(s,id); if(!cur||stamp(cur)!==stamp(old)){SY.again=true; return true} return false};
    for(const x of m[s]){
      keep.add(x.id);
      const old=before.get(x.id);
      if(old&&JSON.stringify(old)===JSON.stringify(x)) continue;
      if(old&&await touched(old,x.id)) continue;
      await rawPut(s,x); changed=true;
    }
    for(const old of snap[s]) if(!keep.has(old.id)){
      if(await touched(old,old.id)) continue;
      if(s==='notes') for(const p of old.photos||[]) await rawDel('photos',p);
      await rawDel(s,old.id); changed=true;
    }
  }
  const cur=((await dbGet('meta','deleted'))||{}).value||[], known=new Set(m.deleted.map(t=>t.id));
  await rawPut('meta',{key:'deleted', value:[...m.deleted,...cur.filter(t=>!known.has(t.id))]});
  return changed;
}
async function syncPhotos(notes){
  const mu=await dbGet('meta','photosUp'), up=new Set(mu?mu.value:[]);
  let got=false;
  try{
    for(const n of notes) for(const id of n.photos||[]){
      const p=await dbGet('photos',id);
      if(p){
        if(up.has(id)) continue;
        const r=await gh('/contents/'+SYNC_PHOTOS+id+'.jpg',{method:'PUT',
          body:{message:'Дела: фото из Блокнота', content:p.data.split(',')[1]}});
        if(!r.ok&&r.status!==422) throw ghFail(r); // 422 — такой файл уже есть
        up.add(id);
      }else{
        const f=await ghGet(SYNC_PHOTOS+id+'.jpg');
        if(!f) continue; // другое устройство ещё не догрузило
        await rawPut('photos',{id, data:'data:image/jpeg;base64,'+f.b64.replace(/\s/g,'')});
        up.add(id); got=true;
      }
    }
  }finally{await rawPut('meta',{key:'photosUp', value:[...up]})}
  return got;
}
function softRender(){
  // не перерисовываем под пальцем: пока что-то печатают или тащат плитку
  const a=document.activeElement;
  if(suppressClick||(a&&app.contains(a)&&/INPUT|TEXTAREA/.test(a.tagName))) return;
  render();
}

function openSync(){
  const c=syncCfg||{};
  showModal(`<h2>Синхронизация</h2>
    <div class="hint">Блокнот держит копию в твоём закрытом репозитории на GitHub. Что запишешь в чате «Дела» — появится здесь, что запишешь здесь — увидит Клод. Без интернета всё работает как раньше и догоняет потом.</div>
    <label>Репозиторий</label>
    <input type="text" id="s-repo" value="${esc(c.repo||'mahmoudik-byte/dela')}" autocapitalize="off">
    <label>Токен GitHub</label>
    <input type="password" id="s-token" placeholder="${c.token?'сохранён — оставь пустым':'github_pat_…'}" autocomplete="off">
    <div class="hint">Токен хранится только на этом телефоне.</div>
    <div class="hint" id="sync-status">${syncStatusText()}</div>
    <button class="btn" onclick="saveSync()">${c.token?'Сохранить':'Включить'}</button>
    ${c.token?`<button class="btn gray" onclick="syncNow(true)">${ic('refresh')} Синхронизировать сейчас</button>
    <button class="btn gray" onclick="confirmDo('Выключить синхронизацию? Записи на телефоне останутся.', disableSync, 'Выключить')">Выключить</button>`:''}`);
}
async function saveSync(){
  const repo=document.getElementById('s-repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/+$/,'');
  const token=document.getElementById('s-token').value.trim()||(syncCfg&&syncCfg.token);
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){toast('Репозиторий пиши так: владелец/название'); return}
  if(!token){toast('Вставь токен'); return}
  syncCfg={...(syncCfg||{}), repo, token};
  await rawPut('meta',{key:'sync', value:syncCfg});
  setSync({err:'', last:0});
  closeModal(); render(); toast('Синхронизирую…');
  await syncNow(true);
}
async function disableSync(){
  await rawDel('meta','sync'); syncCfg=null;
  setSync({err:'', last:0}); closeModal(); render(); toast('Синхронизация выключена');
}

/* ---------- запуск ---------- */
(async()=>{
  db=await openDB();
  await seed();
  await loadSyncCfg();
  render();
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator && location.protocol==='https:')
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  syncNow();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-SY.last>15000)syncNow()});
  window.addEventListener('online',()=>syncNow());
  setInterval(()=>{if(document.visibilityState==='visible')syncNow()},60000);
})();
</script>
